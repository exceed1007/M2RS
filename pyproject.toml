[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "m2rs"
version = "1.0.0"
description = "Multi-Mechanism Robust Segmentation for binary protocol field boundary inference"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21",
    "scapy>=2.4.5",
    "scikit-learn>=1.0",
    "joblib>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
m2rs = "m2rs.cli:main"

[tool.setuptools]
packages = ["m2rs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", "outputs", "logs", "models"]
